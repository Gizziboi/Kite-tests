# Free emulator smoke test for Kite (GitHub-hosted runner, KVM, Android 14 x86_64).
# This repo is public, so standard runners cost no Actions minutes.
# Runs when a new APK lands in apks/, or by hand from the Actions tab.
# Results: the job summary, plus logs and screenshots in the "kite-test" artifact.
name: Emulator test

on:
  push:
    paths:
      - "apks/*.apk"
      - ".github/workflows/emulator-test.yml"
      - "tools/ci_test.sh"
  workflow_dispatch:
    inputs:
      apk:
        description: "APK to test, e.g. apks/Kite-2.9.2.apk (default: newest in apks/)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: emulator-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Pick the APK
        id: apk
        env:
          INPUT_APK: ${{ github.event.inputs.apk }}
        run: |
          APK="$INPUT_APK"
          [ -n "$APK" ] || APK=$(ls apks/Kite-*.apk | sort -V | tail -1)
          case "$APK" in apks/*.apk) ;; *) echo "Not an APK in apks/: $APK"; exit 1;; esac
          [ -f "$APK" ] || { echo "Missing: $APK"; exit 1; }
          echo "Testing $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Kite on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disk-size: 4096M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tools/ci_test.sh "${{ steps.apk.outputs.path }}" out

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kite-test
          path: out/
          retention-days: 14
